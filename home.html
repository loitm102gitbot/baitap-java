<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lấy lại mật khẩu</title>
</head>
<body>
    <form action="https://google.com" method="POST">

        <fieldset>
            <legend>Lấy lại mật khẩu:</legend>

            <label for="mssv">Mã số sinh viên:</label><br>
            <input type="text" id="mssv" name="mssv" value="19dh110123"><br><br>

            <label for="oldpass">Mật khẩu cũ:</label><br>
            <input type="password" id="oldpass" name="oldpass"><br><br>

            <label for="newpass">Mật khẩu mới:</label><br>
            <input type="password" id="newpass" name="newpass"><br><br>

            <label for="repass">Nhập lại Mật khẩu mới:</label><br>
            <input type="password" id="repass" name="repass"><br><br>

            <input type="submit" value="Lưu lại">

        </fieldset>

    </form>

</body>
</html>
